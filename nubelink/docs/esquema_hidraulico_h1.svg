<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Nubelink H1 - esquema hidráulico de un módulo (1 función) con alimentación de pilotaje</title>
  <rect width="1180" height="820" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker>
    <style>
      .l{stroke:#111;stroke-width:1.8;fill:none}
      .p{stroke:#111;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
      .t{fill:#111}
      .g{fill:#444;font-size:11.5px}
      .box{stroke:#111;stroke-width:1.8;fill:#fff}
      .red{stroke:#b3261e}
      .blue{stroke:#1a56b0}
    </style>
  </defs>

  <text x="20" y="28" class="t" font-size="18" font-weight="bold">Nubelink H1 – esquema hidráulico (1 función, servopistón sobre la varilla del distribuidor manual)</text>
  <text x="20" y="48" class="g">Línea continua = circuito principal de la grúa · Línea de trazos = circuito de pilotaje a baja presión (≤ 30 bar) · Rojo = elementos de seguridad · Trazo grueso = unión mecánica</text>

  <!-- ===== CIRCUITO PRINCIPAL ===== -->
  <!-- bomba -->
  <circle cx="90" cy="600" r="22" class="l"/>
  <path d="M90 578 L104 600 L76 600 Z" fill="#111"/>
  <text x="118" y="596" class="g">Bomba de la grúa</text>
  <text x="118" y="610" class="g">(engranajes, 30–80 L/min)</text>
  <path d="M90 622 L90 660 L60 660 L60 690" class="l"/>
  <path d="M40 690 L40 705 L80 705 L80 690" class="l"/>
  <text x="86" y="705" class="g">T</text>

  <!-- línea P hacia el bloque de contrapresión -->
  <path d="M90 578 L90 430 L200 430" class="l"/>
  <text x="100" y="420" class="g">P</text>
  <circle cx="200" cy="430" r="3.5" fill="#111"/>

  <!-- bloque de contrapresión: válvula de retención con resorte 25–30 bar, en línea -->
  <rect x="200" y="395" width="120" height="70" class="box"/>
  <path d="M225 430 L250 430" class="l"/>
  <circle cx="262" cy="430" r="7" class="l"/>
  <path d="M269 424 L281 436 M269 436 L281 424" class="l"/>
  <path d="M283 430 L295 430" class="l"/>
  <path d="M283 416 l4 -6 l4 6 l4 -6 l4 6" class="l"/>
  <text x="206" y="482" class="g">Bloque de contrapresión</text>
  <text x="206" y="496" class="g">(retención tarada 25–30 bar,</text>
  <text x="206" y="510" class="g">dimensionada al caudal de la bomba)</text>
  <path d="M320 430 L420 430" class="l" marker-end="url(#arr)"/>

  <!-- by-pass de la contrapresión: electroválvula 2/2 NA (dump) -->
  <path d="M200 430 L200 560 L260 560" class="p red"/>
  <rect x="260" y="545" width="60" height="30" class="box red"/>
  <path d="M265 560 L315 560" class="l red"/>
  <path d="M283 548 L297 572" class="l red"/>
  <path d="M320 560 L360 560 L360 705" class="p red"/>
  <path d="M340 690 L340 705 L380 705 L380 690" class="l"/>
  <text x="110" y="640" class="g" fill="#b3261e" font-weight="bold">Dump 2/2 normalmente ABIERTA:</text>
  <text x="110" y="654" class="g" fill="#b3261e">sin energía → P a tanque, sin</text>
  <text x="110" y="668" class="g" fill="#b3261e">contrapresión, pistones libres</text>
  <text x="110" y="682" class="g" fill="#b3261e">= MODO MANUAL</text>

  <!-- distribuidor manual -->
  <rect x="420" y="380" width="170" height="100" class="box"/>
  <text x="430" y="402" class="t" font-weight="bold">Distribuidor manual</text>
  <text x="430" y="418" class="g">original (centro abierto)</text>
  <line x1="450" y1="430" x2="560" y2="430" class="l"/>
  <rect x="470" y="440" width="70" height="28" class="box"/>
  <text x="478" y="459" class="g">carrete + resorte</text>
  <path d="M505 380 L505 330" class="l" stroke-width="2.6"/>
  <circle cx="505" cy="380" r="4" fill="#111"/>
  <text x="515" y="352" class="g">varilla / palanca de doble mando</text>
  <path d="M590 415 L640 415 M590 445 L640 445" class="l"/>
  <text x="646" y="419" class="g">A – al cilindro</text>
  <text x="646" y="449" class="g">B – de la grúa</text>
  <path d="M505 480 L505 705" class="l"/>
  <path d="M485 690 L485 705 L525 705 L525 690" class="l"/>

  <!-- ===== CIRCUITO DE PILOTAJE ===== -->
  <path d="M200 430 L200 300 L260 300" class="p"/>
  <rect x="260" y="280" width="60" height="40" class="box"/>
  <path d="M265 300 L315 300" class="l"/>
  <path d="M290 282 L290 318" class="l"/>
  <path d="M283 322 l4 6 l4 -6 l4 6" class="l"/>
  <text x="232" y="254" class="g">Reductora 3 vías fija, tara 30 bar</text>
  <text x="232" y="268" class="g">(entrada hasta 350 bar)</text>
  <path d="M320 300 L345 300" class="p"/>
  <path d="M360 285 L375 300 L360 315 L345 300 Z" class="l"/>
  <path d="M348 300 L372 300" class="l" stroke-dasharray="2 2"/>
  <text x="335" y="335" class="g">Filtro 10 µm</text>
  <path d="M375 300 L760 300" class="p"/>
  <text x="400" y="292" class="g">Galería P piloto (≤ 30 bar)</text>

  <!-- válvula de seguridad 40 bar -->
  <path d="M640 300 L640 240" class="p red"/>
  <rect x="620" y="200" width="40" height="40" class="box red"/>
  <path d="M640 205 L640 235" class="l red"/>
  <path d="M640 205 L630 218 L650 218 Z" fill="#b3261e"/>
  <path d="M660 220 l6 -6 l6 6 l6 -6" class="l red"/>
  <path d="M640 200 L640 178" class="p red"/>
  <path d="M620 163 L620 178 L660 178 L660 163" class="l"/>
  <text x="470" y="215" class="g" fill="#b3261e">Seguridad 40 bar</text>
  <text x="470" y="229" class="g" fill="#b3261e">(protege el bloque si</text>
  <text x="470" y="243" class="g" fill="#b3261e">falla la reductora)</text>

  <!-- ===== MÓDULO H1 ===== -->
  <rect x="745" y="60" width="425" height="640" rx="8" class="box" stroke-dasharray="3 3"/>
  <text x="757" y="82" class="t" font-size="15" font-weight="bold">Módulo Nubelink H1 (uno por función)</text>

  <!-- galería T piloto -->
  <path d="M1152 232 L1152 640" class="p"/>
  <path d="M1132 640 L1132 655 L1172 655 L1172 640" class="l"/>
  <text x="1000" y="675" class="g">Galería T piloto → tanque</text>

  <!-- Válvula proporcional A -->
  <text x="757" y="102" class="t" font-weight="bold">V_A – reductora-relevadora proporcional 3 vías (P·A·T)</text>
  <rect x="800" y="130" width="90" height="60" class="box"/>
  <path d="M805 160 L885 160" class="l"/>
  <path d="M845 132 L845 188" class="l"/>
  <path d="M805 175 L885 175" class="l" stroke-dasharray="3 3"/>
  <rect x="890" y="145" width="26" height="30" class="box"/>
  <path d="M893 150 L913 170 M893 170 L913 150" class="l"/>
  <text x="920" y="163" class="g">24 V PWM</text>
  <text x="757" y="206" class="g">rango 0–20 / 0–35 bar · corriente ↑ ⇒ presión en A ↑ · sin corriente: A→T</text>
  <!-- P entra por abajo-izq, T sale por abajo-der, A por arriba -->
  <path d="M760 300 L760 225 L820 225 L820 190" class="p"/>
  <text x="808" y="222" class="g">P</text>
  <path d="M870 190 L870 232 L1152 232" class="p"/>
  <text x="874" y="245" class="g">T</text>
  <path d="M845 130 L845 112 L960 112 L960 340" class="p"/>
  <text x="965" y="260" class="g">A</text>

  <!-- Válvula proporcional B -->
  <text x="930" y="453" class="t" font-weight="bold">V_B – ídem, otro sentido</text>
  <rect x="800" y="460" width="90" height="60" class="box"/>
  <path d="M805 490 L885 490" class="l"/>
  <path d="M845 462 L845 518" class="l"/>
  <path d="M805 505 L885 505" class="l" stroke-dasharray="3 3"/>
  <rect x="890" y="475" width="26" height="30" class="box"/>
  <path d="M893 480 L913 500 M893 500 L913 480" class="l"/>
  <text x="920" y="493" class="g">24 V PWM</text>
  <path d="M760 300 L760 550 L820 550 L820 520" class="p"/>
  <text x="808" y="547" class="g">P</text>
  <path d="M870 520 L870 565 L1152 565" class="p"/>
  <text x="874" y="578" class="g">T</text>
  <path d="M845 460 L845 425 L1060 425 L1060 400" class="p"/>
  <text x="1065" y="418" class="g">B</text>

  <!-- Servopistón -->
  <text x="905" y="318" class="g" font-weight="bold">Servopistón Ø25 / vástago pasante Ø12</text>
  <text x="905" y="332" class="g">carrera ±20 mm (topes ajustables, p. ej. ±13)</text>
  <rect x="900" y="340" width="220" height="60" class="box"/>
  <rect x="1000" y="342" width="20" height="56" fill="#c9a267" stroke="#111" stroke-width="1.5"/>
  <path d="M880 370 L1000 370 M1020 370 L1160 370" class="l" stroke-width="4"/>
  <rect x="1130" y="355" width="24" height="30" fill="#1a56b0" stroke="#111"/>
  <text x="905" y="596" class="g">378 mm² ⇒ 1130 N a 30 bar</text>
  <text x="905" y="610" class="g">sin energía: A y B a T ⇒ pistón libre</text>
  <text x="905" y="626" class="g" fill="#1a56b0">Sensor de posición (Hall / potenciómetro):</text>
  <text x="905" y="640" class="g" fill="#1a56b0">lazo cerrado + supervisión de neutro</text>
  <path d="M1142 385 L1142 582" class="l blue" stroke-dasharray="2 3"/>

  <!-- horquilla hacia la palanca -->
  <path d="M880 370 L830 370 L830 330 L505 330" class="l" stroke-width="2.6"/>
  <text x="620" y="323" class="g">horquilla → varilla del distribuidor (unión mecánica)</text>

  <!-- ===== LÓGICA DE ESTADOS ===== -->
  <rect x="20" y="722" width="1140" height="84" rx="6" fill="#f4f4f4" stroke="#bbb"/>
  <text x="32" y="740" class="g" font-weight="bold">Lógica de estados</text>
  <text x="32" y="756" class="g">• Radio apagada / paro de emergencia: dump ABIERTA (sin energía) y V_A, V_B sin corriente ⇒ pistones a tanque, sin contrapresión ⇒ palancas manuales normales.</text>
  <text x="32" y="771" class="g">• Radio activa: dump CERRADA ⇒ contrapresión 25–30 bar ⇒ pilotaje disponible; joystick ⇒ corriente en V_A o V_B ⇒ presión ∝ corriente ⇒ empuje contra el resorte del carrete.</text>
  <text x="32" y="786" class="g">• Pérdida de enlace / fallo: corte por HARDWARE de la alimentación de dump y bobinas (independiente del microcontrolador) ⇒ retorno a neutro por el resorte del distribuidor.</text>
  <text x="32" y="801" class="g">• Costo energético: la contrapresión disipa p·Q con el distribuidor en neutro (30 bar × 60 L/min ≈ 3 kW), sólo con radio activa. Alternativa: minicentral 24 V de pilotaje.</text>
</svg>
